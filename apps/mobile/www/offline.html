<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Palee</title>
    <!-- ADR-171: shown by the native shell (server.errorPath) when the web app
         cannot be reached, e.g. a cold start without a connection. -->
    <script src="app-config.js"></script>
    <!-- Colours: palee-theme.css, generated from the web theme. -->
    <link rel="stylesheet" href="palee-theme.css" />
    <style>
      html, body { margin: 0; height: 100%; background: var(--background); color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px; text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: var(--muted); max-width: 28rem; }
      button { margin-top: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px;
        background: var(--primary); color: var(--primary-contrast); font: inherit; font-weight: 600; }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Χωρίς σύνδεση</h1>
      <p id="body">Το Palee χρειάζεται σύνδεση για να ανοίξει. Ό,τι κατέγραψες χωρίς σύνδεση μένει στη συσκευή και στέλνεται μόλις επανέλθει.</p>
      <button id="retry" type="button">Δοκίμασε ξανά</button>
    </main>
    <script>
      (function () {
        var english = !/^el\b/i.test(navigator.language || "el");
        if (english) {
          document.documentElement.lang = "en";
          document.getElementById("title").textContent = "No connection";
          document.getElementById("body").textContent =
            "Palee needs a connection to open. Anything you logged offline stays on this device and is sent once you are back online.";
          document.getElementById("retry").textContent = "Try again";
        }
        function retry() {
          if (window.PALEE_APP_URL) window.location.replace(window.PALEE_APP_URL);
        }
        document.getElementById("retry").addEventListener("click", retry);
        window.addEventListener("online", retry);
      })();
    </script>
  </body>
</html>

name: Build Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']

# One run per ref: a newer push to main (or a force-moved tag) cancels the
# run it supersedes instead of queueing behind it. Needs Gitea >= 1.25.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-verify:
    name: Verify API
    runs-on: ubuntu-latest
    container: cimg/elixir:1.18.1-erlang-27.2.2-browsers
    services:
      postgres:
        # PostGIS: the migrations create the postgis extension.
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: palee_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d palee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          node -v
          npm -v
          elixir -v
          openssl version -a
          ldconfig -p | grep -E 'libcrypto\.so\.(3|1\.1)' || true
      - run: mix local.hex --force
        working-directory: apps/api
      - run: mix local.rebar --force
        working-directory: apps/api
      - run: mix deps.get
        working-directory: apps/api
      # The admin user only creates the non-superuser owner role and the
      # test database; migrations and tests run as that role, as prod does
      # (mix palee.test.migrate).
      - run: mix precommit
        working-directory: apps/api
        env:
          DB_HOST: postgres
          DB_NAME: palee_test
          DB_ADMIN_PASSWORD: postgres
          DB_ADMIN_USER: postgres

  web-verify:
    name: Verify web
    runs-on: ubuntu-latest
    container: cimg/elixir:1.18.1-erlang-27.2.2-browsers
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          node -v
          npm -v
          elixir -v
      - run: npm ci
        working-directory: apps/web
      - run: mix local.hex --force
        working-directory: apps/api
      - run: mix local.rebar --force
        working-directory: apps/api
      - run: mix deps.get
        working-directory: apps/api
      - run: npm run check
        working-directory: apps/web
      # The image's Chrome: the runner cannot reach cdn.playwright.dev to
      # download Playwright's Chromium. playwright.config.ts asks it for
      # software WebGL; the 3D figure tests skip if it still has none.
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      # The traces of failed e2e tests (what the page showed, step by step),
      # so a CI-only failure can be read instead of guessed at.
      - if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: apps/web/test-results
          retention-days: 7

  version:
    name: Pick tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: echo "tag=$(date +%s)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.image }}
    needs: [api-verify, web-verify, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: apps/api
          - image: web
            context: apps/web
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Create Kubeconfig
        run: |
          mkdir $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BUILDX }}" > $HOME/.kube/config
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: namespace=tenant-4kq-gitea-runner-containers
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: oci.4kq.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            oci.4kq.net/client-milos/${{ matrix.image }}:${{ github.sha }}
            oci.4kq.net/client-milos/${{ matrix.image }}:${{ needs.version.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('oci.4kq.net/client-milos/{0}:{1}', matrix.image, github.ref_name) || '' }}

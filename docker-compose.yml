services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ecto://${DB_RUNTIME_USER:-milos_runtime}:${DB_RUNTIME_PASSWORD:?set DB_RUNTIME_PASSWORD in your environment or .env}@postgres/${DB_NAME:-milos_training_dev}
      MIGRATION_DATABASE_URL: ecto://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres/${DB_NAME:-milos_training_dev}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-milos_training_dev}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USER: ${DB_USER:-postgres}
      GUARDIAN_ISSUER: ${GUARDIAN_ISSUER:-milos_training}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:?set GUARDIAN_SECRET_KEY in your environment or .env}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
      MEILI_URL: http://meilisearch:7700
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_ICON_MODEL: ${GEMINI_ICON_MODEL:-gemini-2.5-flash-lite}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://media.localhost:18080}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-milos_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-milos-minio-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-milos-invoices}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET:-milos-avatars}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-milos-media}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in your environment or .env}
      MIX_ENV: prod
      # Observability (ADR-116). All empty by default = no trace export and no
      # metrics listener. See ops/observability/README.md to enable.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-milos-training-api}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-milos-training}
      METRICS_PORT: ${METRICS_PORT:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Push to the store apps (ADR-171). Empty = that provider is off.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
    command: sh -lc "./bin/milos_training eval \"MilosTraining.Release.migrate()\" && exec ./bin/milos_training start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    profiles: ["migration"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ecto://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres/${DB_NAME:-milos_training_dev}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-milos_training_dev}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USER: ${DB_USER:-postgres}
      GUARDIAN_ISSUER: ${GUARDIAN_ISSUER:-milos_training}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:?set GUARDIAN_SECRET_KEY in your environment or .env}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
      MEILI_URL: http://meilisearch:7700
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in your environment or .env}
      MIX_ENV: prod
    command: ./bin/milos_training eval "MilosTraining.Release.migrate()"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks: [app]
    restart: "no"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://media.localhost:18080}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-${MINIO_PUBLIC_ENDPOINT:-http://media.localhost:18080}}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MAP_ORIGINS: ${NEXT_PUBLIC_MAP_ORIGINS:-}
    environment:
      API_PROXY_TARGET: http://api:4000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://media.localhost:18080}
      NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-${MINIO_PUBLIC_ENDPOINT:-http://media.localhost:18080}}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
      NEXT_PUBLIC_MAP_ORIGINS: ${NEXT_PUBLIC_MAP_ORIGINS:-}
      # Universal links / App Links for the store apps (ADR-171). Empty = 404.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
      ANDROID_SHA256_CERT_FINGERPRINTS: ${ANDROID_SHA256_CERT_FINGERPRINTS:-}
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_HTTP_HOST_PORT:-18080}:80"
      - "${CADDY_HTTPS_HOST_PORT:-18443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [app]

  postgres:
    image: postgis/postgis:16-3.5-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300s
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-milos_training_dev}
      POSTGRES_RUNTIME_USER: ${DB_RUNTIME_USER:-milos_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?set DB_RUNTIME_PASSWORD in your environment or .env}
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
      - ./.postgres-wal-archive:/var/lib/postgresql/wal_archive
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-milos_training_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgis/postgis:16-3.5-alpine
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-milos_training_dev}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MIN_FREE_PERCENT: ${BACKUP_MIN_FREE_PERCENT:-15}
      WAL_ARCHIVE: /wal-archive
    volumes:
      - ./ops/postgres/backup:/backup:ro
      - ./.postgres-backups:/backups/postgres
      - ./.postgres-wal-archive:/wal-archive:ro
    command: /backup/run-backup.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]
    restart: "no"

  postgres-restore-drill:
    image: postgis/postgis:16-3.5-alpine
    profiles: ["backup"]
    environment:
      BACKUP_ROOT: /backups/postgres
      WAL_ARCHIVE: /wal-archive
    volumes:
      - ./ops/postgres/backup:/backup:ro
      - ./.postgres-backups:/backups/postgres:ro
      - ./.postgres-wal-archive:/wal-archive:ro
    command: /backup/restore-drill.sh
    depends_on:
      postgres-backup:
        condition: service_completed_successfully
    networks: [app]
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - ./.redis-data:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.45.2@sha256:271ee84030a77cfa8e60358138bb34260f69110795c2441437b44832fe865618
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
    volumes:
      - ./.meilisearch-data:/meili_data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-milos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-milos-minio-change-me}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - ./.minio-data:/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Opt-in observability stack (ADR-116): docker compose --profile observability up -d
  # Nothing below starts without the profile. Prometheus/Alertmanager/Grafana
  # bind to 127.0.0.1 only and are never routed through Caddy.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [app]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["observability"]
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://127.0.0.1:19090}
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./ops/observability/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector
      - alertmanager
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: ["observability"]
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://127.0.0.1:19093}
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-19093}:9093"
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: ["observability"]
    # Compose cannot require a variable only for one profile (":?" fails the
    # default `up` too), so the container refuses to start without a password.
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ -z "$${GF_SECURITY_ADMIN_PASSWORD}" ]; then echo "observability: set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; fi; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:13000}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/etc/grafana/dashboards/milos:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  app:

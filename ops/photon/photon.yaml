# Self-hosted Photon geocoder (cluster-internal only). Guide: docs/operations/self-hosted-photon.md
# Namespace-agnostic: apply into the tenant namespace from the gitops repo, e.g.
#   kustomize: namespace: tenant-m4
# No Ingress on purpose. The api reaches it at http://photon.<namespace>.svc.cluster.local:2322
---
apiVersion: v1
kind: Service
metadata:
  name: photon
  labels:
    app.kubernetes.io/name: photon
    app.kubernetes.io/part-of: palee
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: photon
    app.kubernetes.io/part-of: palee
  ports:
    - name: http
      port: 2322
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photon
  labels:
    app.kubernetes.io/name: photon
    app.kubernetes.io/part-of: palee
spec:
  serviceName: photon
  replicas: 1                      # one index per PVC; do not scale without a second PVC/index
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate            # with 1 replica this is stop-then-start (like Recreate)
  selector:
    matchLabels:
      app.kubernetes.io/name: photon
      app.kubernetes.io/part-of: palee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photon
        app.kubernetes.io/part-of: palee
    spec:
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9011            # image's "photon" user; entrypoint skips its root-only chown/gosu path
        runAsGroup: 9011
        fsGroup: 9011
        fsGroupChangePolicy: OnRootMismatch   # avoid a recursive chown of ~100 GB on every start
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: photon
          # rtuszik/photon-docker 2.4.0 bundles Photon 1.3.0 on Temurin 21 JRE (multi-arch index digest).
          image: docker.io/rtuszik/photon-docker:2.4.0@sha256:21549c60f9e6488fff3217e40429a652c4b445f374800333fe32859e47cec293
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2322
          env:
            - name: REGION
              value: planet        # "any country". Smaller: europe, or a country with a prebuilt DB index
            - name: IMPORT_MODE
              value: db            # download the prebuilt index (no in-cluster import)
            - name: BASE_URL       # image default is a community mirror; use the official source
              value: https://download1.graphhopper.com/public
            - name: UPDATE_STRATEGY
              value: PARALLEL      # build the new index beside the old one, swap, no downtime (~2x disk)
            - name: UPDATE_INTERVAL
              value: 30d
            - name: ENABLE_METRICS
              value: "TRUE"        # Prometheus at /metrics
            - name: JAVA_PARAMS
              value: "-Xms12g -Xmx12g"   # heap; the rest of the memory is page cache for the index
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "1"
              memory: 24Gi
            limits:
              memory: 32Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # not verified that the process manager writes only to /photon/data
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /photon/data
          # First start downloads ~63 GB and unpacks it: allow up to 24 h before liveness applies.
          startupProbe:
            httpGet: {path: /status, port: http}
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 1440
          readinessProbe:
            httpGet: {path: "/api?q=berlin&limit=1", port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: "/api?q=berlin&limit=1", port: http}
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10   # tolerate the brief restart during an index swap
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <fast-ssd-class>   # SSD/NVMe strongly recommended
        resources:
          requests:
            storage: 320Gi

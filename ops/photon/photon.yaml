# Self-hosted Photon for Palee (ADR-188): Greece, Cyprus and France (with
# Monaco), built from the official Photon JSON dumps, cluster-internal only.
# Apply into the API's namespace from the gitops repo, then set on the API:
#   PHOTON_BASE_URL=http://photon.<namespace>.svc.cluster.local:2322
# Places outside these countries still come from the public Photon (capped
# and cached by the API) and from the GeoNames towns in Postgres.
#
# Sizes measured 2026-10-23 (see docs/operations/self-hosted-photon.md):
#   Greece + Cyprus: 93 MB download, 0.5 GB index, ~0.4 GB RAM serving.
#   + France/Monaco: +1.6 GB download, index measured in the guide.
# A rebuild keeps the old index until the new one is ready, so the volume
# needs about twice the index size.
---
apiVersion: v1
kind: Service
metadata:
  name: photon
  labels:
    app.kubernetes.io/name: photon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: photon
  ports:
    - name: http
      port: 2322
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: photon-build
  labels:
    app.kubernetes.io/name: photon
data:
  # Region dump paths under DUMP_BASE_URL, in country-code order (the dumps
  # are sorted by country; keep the combined stream sorted too).
  REGIONS: "europe/cyprus europe/france-monacco europe/greece"
  DUMP_BASE_URL: "https://download1.graphhopper.com/public"
  PHOTON_VERSION: "1.3.0"
  # Name translations kept in the index (and requestable with lang=).
  LANGUAGES: "el,en,fr,de,it"
  # The index is rebuilt at pod start when older than this.
  MAX_AGE_DAYS: "30"
  build.sh: |
    #!/bin/sh
    set -eu
    DATA=/data
    MARKER="$DATA/photon_data/.palee-built"
    WANT="$PHOTON_VERSION $LANGUAGES $REGIONS"

    if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$WANT" ]; then
      age=$(( $(date +%s) - $(stat -c %Y "$MARKER") ))
      if [ "$age" -lt $(( MAX_AGE_DAYS * 86400 )) ]; then
        echo "index is fresh (${age}s old), nothing to build"
        exit 0
      fi
    fi

    apt-get update -qq
    apt-get install -y -qq --no-install-recommends zstd curl ca-certificates >/dev/null

    jar="$DATA/photon-$PHOTON_VERSION.jar"
    if [ ! -s "$jar" ]; then
      curl -fsSL -o "$jar.part" \
        "https://github.com/komoot/photon/releases/download/$PHOTON_VERSION/photon-$PHOTON_VERSION.jar"
      mv "$jar.part" "$jar"
    fi
    ln -sf "$(basename "$jar")" "$DATA/photon.jar"

    rm -rf "$DATA/next" && mkdir -p "$DATA/next"
    first=1
    {
      for region in $REGIONS; do
        name=$(basename "$region")
        url="$DUMP_BASE_URL/$region/photon-dump-$name-1.0-latest.jsonl.zst"
        echo "downloading $url" >&2
        if [ "$first" = 1 ]; then
          curl -fsSL "$url" | zstd -dc
          first=0
        else
          # Later dumps repeat the file header and country list: skip them.
          curl -fsSL "$url" | zstd -dc | tail -n +3
        fi
      done
    } | java $JAVA_OPTS -jar "$jar" import -import-file - -languages "$LANGUAGES" -data-dir "$DATA/next"

    rm -rf "$DATA/old"
    [ -d "$DATA/photon_data" ] && mv "$DATA/photon_data" "$DATA/old"
    mv "$DATA/next/photon_data" "$DATA/photon_data"
    echo "$WANT" > "$MARKER"
    rm -rf "$DATA/old" "$DATA/next"
    chown -R 1000:1000 "$DATA"
    echo "index built"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photon
  labels:
    app.kubernetes.io/name: photon
spec:
  serviceName: photon
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: photon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photon
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Builds (or refreshes) the index; root only for apt and chown.
        - name: build-index
          image: eclipse-temurin:21.0.12_8-jre-noble
          command: ["/bin/sh", "/scripts/build.sh"]
          envFrom:
            - configMapRef:
                name: photon-build
          env:
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx3g"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
      containers:
        - name: photon
          image: eclipse-temurin:21.0.12_8-jre-noble
          command:
            - /bin/sh
            - -c
            - exec java $JAVA_OPTS -jar /data/photon.jar serve -data-dir /data -listen-ip 0.0.0.0 -listen-port 2322
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1536m"
          ports:
            - name: http
              containerPort: 2322
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api?q=athens&limit=1
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: scripts
          configMap:
            name: photon-build
            items:
              - key: build.sh
                path: build.sh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
---
# Monthly refresh: restarting the pod lets build-index fetch newer dumps
# (while it rebuilds, the API falls back to the public Photon on its own).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: photon-refresh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: photon-refresh
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["photon-0"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: photon-refresh
subjects:
  - kind: ServiceAccount
    name: photon-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: photon-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: photon-refresh
spec:
  schedule: "30 3 2 * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: photon-refresh
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              image: alpine/kubectl:1.37.1
              args: ["delete", "pod", "photon-0", "--wait=false"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
